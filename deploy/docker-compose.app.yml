# Taşıtsan self-host uygulama servisi.
# Kullanım: docker compose -f deploy/docker-compose.app.yml up -d --build
# Supabase self-host ayrı bir compose ile çalışır (deploy/README.md).

services:
  tasitsan-app:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY}
        VITE_SUPABASE_PROJECT_ID: ${VITE_SUPABASE_PROJECT_ID}
    image: tasitsan/app:latest
    container_name: tasitsan-app
    restart: unless-stopped
    env_file:
      - ./.env.selfhost
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOST: "0.0.0.0"
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/public/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
