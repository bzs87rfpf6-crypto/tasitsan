name: Deploy Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Deploy to Taşıtsan server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script_stop: true
          script: |
            set -euo pipefail

            REPO_DIR="${{ secrets.DEPLOY_PATH }}"
            APP_LINK="/opt/tasitsan/tasitsan"
            RELEASES_DIR="/opt/tasitsan/releases"
            INCOMING="/opt/tasitsan/incoming-$(date +%Y%m%d-%H%M%S)"

            cleanup() {
              rm -rf "$INCOMING"
            }
            trap cleanup EXIT

            echo "==> Güncel kaynak hazırlanıyor"
            mkdir -p "$INCOMING"

            git -C "$REPO_DIR" fetch origin main

            git -C "$REPO_DIR" archive origin/main \
              | tar -x -C "$INCOMING"

            echo "==> Production .env aktarılıyor"
            cp "$APP_LINK/.env" "$INCOMING/.env"

            test -f "$INCOMING/deploy/deploy-systemd.sh" || {
              echo "HATA: deploy-systemd.sh bulunamadı"
              exit 1
            }

            chmod +x "$INCOMING/deploy/deploy-systemd.sh"

            echo "==> Safe release deploy başlıyor"

            SOURCE_DIR="$INCOMING" \
            APP_LINK="$APP_LINK" \
            RELEASES_DIR="$RELEASES_DIR" \
            SERVICE="tasitsan.service" \
            HEALTH_URL="http://127.0.0.1:3000/api/public/health" \
              bash "$INCOMING/deploy/deploy-systemd.sh"

            echo "==> Production deploy tamamlandı"
            echo "Current release:"
            readlink -f "$APP_LINK"
